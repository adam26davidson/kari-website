version: 0.0
os: linux

# Test-environment variant of appspec.yml — the deploy workflow copies this
# file to the TEST bundle root as `appspec.yml` (CodeDeploy requires that
# name). Only the file destinations differ from prod; the lifecycle scripts
# are shared and pick the right service/port from DEPLOYMENT_GROUP_NAME
# (see scripts/deploy/env.sh). Keep hooks in sync with appspec.yml.
files:
  - source: dist
    destination: /home/ubuntu/static-sites/kari-website-test
  - source: kari-website-api
    destination: /home/ubuntu/kari-api-test

hooks:
  # Stop the API before overwriting its binary (avoids "text file busy").
  # BeforeInstall runs from the incoming revision, so it works on the first deploy too.
  BeforeInstall:
    - location: scripts/deploy/stop.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/deploy/after_install.sh
      timeout: 60
      runas: root
  ApplicationStart:
    - location: scripts/deploy/start.sh
      timeout: 90
      runas: root
  ValidateService:
    - location: scripts/deploy/validate.sh
      timeout: 60
      runas: root
