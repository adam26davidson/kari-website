# Local S3 stand-in for dev and e2e (see scripts/dev.sh and CLAUDE.md).
# Conventions (credentials, bucket) are shared with ui/e2e/config.mjs and
# api/.env — keep them in sync.
#
# No fixed container_name: compose's directory-based project naming gives
# every worktree its own container, so parallel stacks never collide and
# `docker compose down` only ever touches this directory's stack.
#
# The host port defaults to 9000 (what CI, api/.env, and ui/.env.test
# assume). Set KARI_MINIO_PORT to publish on another port, or to 0 for an
# ephemeral one — discover it with `docker compose port minio 9000`.
# scripts/dev.sh does exactly that when 9000 is already taken.
services:
  minio:
    image: minio/minio
    command: server /data
    ports:
      - "${KARI_MINIO_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: kari-e2e
      MINIO_ROOT_PASSWORD: kari-e2e-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
