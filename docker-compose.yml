# Local S3 stand-in for dev and e2e (see scripts/dev.sh and CLAUDE.md).
# Conventions (credentials, bucket) are shared with ui/e2e/config.mjs and
# api/.env — keep them in sync.
#
# No fixed container_name: compose's directory-based project naming gives
# every worktree its own container, so parallel stacks never collide and
# `docker compose down` only ever touches this directory's stack.
#
# The host port defaults to 9000 (what CI, api/.env, and ui/.env.test
# assume). Set KARI_S3_PORT to publish on another port, or to 0 for an
# ephemeral one — discover it with `docker compose port s3 9000`.
# scripts/dev.sh does exactly that when 9000 is already taken.
#
# The server is RustFS (Apache-2.0), not MinIO. MinIO withdrew its free
# images: first the `minio/minio` Docker Hub repository, then anonymous
# pulls of quay.io/minio/minio (#973), each of which killed CI at the
# "Start local S3" step while machines with the image cached kept working.
# RustFS speaks the same S3 API on the same port, honours the public-read
# bucket policy ui/e2e/seed.mjs installs, and keeps its data in /data.
#
# RUSTFS_CORS_ALLOWED_ORIGINS matters: the public site fetch()es its JSON
# from this origin, cross-origin, and RustFS sends no CORS headers unless
# told to (MinIO allowed any origin by default). Without it every page
# that loads content fails in the browser while curl looks fine.
#
# The tag is pinned so a CI run and a laptop agree on the binary; Renovate
# proposes bumps.
services:
  s3:
    image: rustfs/rustfs:1.0.0
    ports:
      - "${KARI_S3_PORT:-9000}:9000"
    environment:
      RUSTFS_ACCESS_KEY: kari-e2e
      RUSTFS_SECRET_KEY: kari-e2e-secret
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
