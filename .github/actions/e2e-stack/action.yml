# Stands up the hermetic e2e stack shared by the frontend-e2e job in
# ci.yml and the visual-review job in visual-review.yml, so a change to
# how the stack boots happens in one place.
#
# The stack is fully local and hermetic: a throwaway MinIO stands in for
# S3 (seeded with fixture content by ui/e2e/seed.mjs), and the real API
# runs on localhost:3000 against it. No AWS account or shared bucket is
# involved, so runs can't be broken by drifting bucket data.
#
# Expects the repo to be checked out already (the caller runs
# actions/checkout first) and runs from the repo root — composite `run`
# steps set their own working-directory, so callers' `defaults.run` do
# not apply here.
name: Hermetic e2e stack
description: >
  Node + npm ci, Rust + cargo cache, local MinIO (seeded), the API built
  and health-polled on localhost:3000, and Playwright's chromium (cached
  by version) — the full local stack the Playwright e2e tests and visual
  screenshots run against.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24.19.0'
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ui
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: api

    - name: Start local S3 (MinIO)
      # docker-compose.yml lives at the repo root.
      shell: bash
      run: docker compose up -d --wait minio

    # Create + seed the bucket before the API starts: its /health probes
    # S3 read/write, so the bucket must exist first. (npm run test:e2e
    # re-seeds, which is idempotent.)
    - name: Seed local S3
      shell: bash
      working-directory: ui
      run: node e2e/seed.mjs

    - name: Build API
      shell: bash
      working-directory: api
      run: cargo build

    - name: Start API
      shell: bash
      working-directory: api
      env:
        BUCKET_NAME: kari-e2e
        AWS_ENDPOINT_URL: http://localhost:9000
        AWS_REGION: us-east-1
        # Local MinIO credentials (match docker-compose.yml) — not secrets.
        AWS_ACCESS_KEY_ID: kari-e2e
        AWS_SECRET_ACCESS_KEY: kari-e2e-secret
      run: |
        PORT=3000 nohup cargo run > api.log 2>&1 &
        for i in $(seq 1 60); do
          if curl -sf http://localhost:3000/health > /dev/null; then
            echo "API is healthy"
            exit 0
          fi
          sleep 2
        done
        echo "API never became healthy" >&2
        cat api.log >&2
        exit 1

    # Downloading chromium is the stack's most stall-prone step: it was the
    # whole of the e2e job's duration tail (one observed run spent ~28 of its
    # 32 minutes in multi-minute gaps between individual apt downloads from
    # azure.archive.ubuntu.com). Caching the browser takes that off the
    # common path — issue #312.
    #
    # The key is the Playwright version npm ci actually installed, so a
    # Renovate bump invalidates the cache on its own and no string here has
    # to be maintained by hand.
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      working-directory: ui
      run: |
        version="$(npx playwright --version | awk '{print $NF}')"
        if [ -z "$version" ]; then
          echo "could not read the installed Playwright version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Exact match only, deliberately: a restore-keys near-miss would
        # restore a stale browser build that then has to be downloaded
        # anyway, paying the restore for nothing.
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ui
      run: npx playwright install --with-deps chromium

    # A cache hit restores the browser binary but not the apt packages it
    # links against — every run gets a fresh VM, so `--with-deps` on the miss
    # path buys the hit path nothing. In practice ubuntu-latest ships Chrome,
    # Chromium, Edge and Firefox, so their shared libraries (libnss3, libgbm1,
    # libasound2, the atk/gtk stack) are already installed and Playwright's
    # chromium launches without `--with-deps`. That is a property of the
    # runner image, not a promise, and it cannot be verified from a dev
    # machine — so verify it here instead of assuming: launching headless
    # chromium costs ~2s and turns "the image dropped a library" from a
    # confusing red e2e run into a slower green one.
    - name: Verify cached browser launches
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: ui
      run: |
        launches() {
          node -e "require('playwright').chromium.launch()
            .then(b => b.close())"
        }
        if launches; then
          echo "Cached chromium launches"
        else
          echo "::warning::Cached chromium could not launch — reinstalling" \
            "it with its OS dependencies. If this recurs, ubuntu-latest no" \
            "longer carries the browser libraries and the cache-hit path" \
            "needs its own \`npx playwright install-deps chromium\`."
          npx playwright install --with-deps chromium
        fi
