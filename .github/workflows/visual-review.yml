name: Visual review

# AI visual check on PRs that touch the UI: stands up the same hermetic
# stack as the e2e job (MinIO + seed + API + test-mode preview), captures
# screenshots of the public pages and — via the same Auth0 test user the
# admin e2e journeys use — the admin pages (ui/e2e/screenshots.mjs), and
# has Claude review them for visual defects — overflow, clipped images, illegible
# text, broken mobile layout — that behavioral tests can't catch. Findings
# are posted as an advisory sticky PR comment; this job never blocks a
# merge on a design judgment.
#
# Requires a CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`;
# usage draws from the Claude Pro/Max subscription quota, never API credits).
# Without it the job exits early with a notice (so forks and pre-setup
# clones aren't broken).
on:
  pull_request:
    paths:
      - "ui/src/**"
      - "ui/public/**"
      - "ui/index.html"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/e2e/screenshots.mjs"
      - ".github/workflows/visual-review.yml"

concurrency:
  group: visual-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-review:
    name: Screenshot + Claude review
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # All later steps gate on this so the job is a cheap no-op until the
      # secret exists (and on forks, where secrets are never available).
      - name: Check Claude credentials are configured
        id: check
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping visual review — no CLAUDE_CODE_OAUTH_TOKEN secret."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: Setup Node
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        working-directory: ui
        run: npm ci

      - name: Setup Rust
        if: steps.check.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: steps.check.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      # Same hermetic stack as the frontend-e2e job in ci.yml: throwaway
      # MinIO seeded with fixture content, real API against it, test-mode
      # bundle previewed locally.
      - name: Start local S3 (MinIO)
        if: steps.check.outputs.enabled == 'true'
        run: docker compose up -d --wait minio

      - name: Seed local S3
        if: steps.check.outputs.enabled == 'true'
        working-directory: ui
        run: node e2e/seed.mjs

      - name: Build API
        if: steps.check.outputs.enabled == 'true'
        working-directory: api
        run: cargo build

      - name: Start API
        if: steps.check.outputs.enabled == 'true'
        working-directory: api
        env:
          BUCKET_NAME: kari-e2e
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_REGION: us-east-1
          # Local MinIO credentials (match docker-compose.yml) — not secrets.
          AWS_ACCESS_KEY_ID: kari-e2e
          AWS_SECRET_ACCESS_KEY: kari-e2e-secret
        run: |
          PORT=3000 nohup cargo run > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          cat api.log >&2
          exit 1

      - name: Install Playwright browsers
        if: steps.check.outputs.enabled == 'true'
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build and preview test-mode bundle
        if: steps.check.outputs.enabled == 'true'
        working-directory: ui
        run: |
          npm run build:test
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then
              echo "Preview is up"
              exit 0
            fi
            sleep 1
          done
          echo "Preview never came up" >&2
          cat preview.log >&2
          exit 1

      - name: Capture screenshots
        if: steps.check.outputs.enabled == 'true'
        working-directory: ui
        env:
          # Same admin test user as the e2e admin journeys; with these set
          # the script logs in through Auth0 and captures the admin pages
          # too. Absent (e.g. on forks), it captures public pages only.
          E2E_AUTH0_USERNAME: ${{ secrets.E2E_AUTH0_USERNAME }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}
        run: node e2e/screenshots.mjs --base-url http://localhost:4173

      - name: Upload screenshots
        if: steps.check.outputs.enabled == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-screenshots
          path: ui/e2e/screenshots/
          retention-days: 7

      - name: Claude visual review
        if: steps.check.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Pro/Max subscription OAuth token — deliberately the only
          # supported credential, so CI can never bill pay-per-use API credits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action needs a GitHub token for its own setup; without one it
          # attempts an OIDC exchange, which requires the id-token: write
          # permission. The built-in token suffices — Claude only reads the
          # screenshots and writes visual-review.md; the PR comment is posted
          # by the sticky-comment step below.
          github_token: ${{ github.token }}
          claude_args: '--model claude-opus-5 --allowedTools "Read,Glob,Write"'
          prompt: |
            You are doing a visual QA review of a personal website (a
            writer/artist portfolio: haiku, haiga, photography, blog).
            Screenshots live in ui/e2e/screenshots/, named
            <page>.<desktop|mobile>.png (desktop is 1280px wide, mobile
            390px). Pages too tall for one legible image are split into
            sequential tiles named <page>.<viewport>.1.png, .2.png, … —
            top of the page first, with ~100px of overlap between
            consecutive tiles, so review a tiled page by reading its
            tiles in order as one page. They cover the public pages
            and, when captured, the
            admin pages (files named admin-*: list pages, editors opened
            on a fixture item, and image cleanup). The admin pages are
            utilitarian editing UI — judge their layout, legibility, and
            usability (fields and buttons visible, reachable, not
            overlapping), not their visual polish. The content everywhere
            is seeded fixture data, so judge layout and legibility, not
            the content itself; gray placeholder rectangles where photos
            would be are expected and fine.

            Read and look at EVERY png in that directory. For each, check:
            - content overflowing or escaping its container (images
              spilling out of cards, horizontal page overflow)
            - clipped, squashed, or stretched images
            - text that is hard to read against its actual rendered
              background (low contrast, text over busy imagery, text
              overlapping other text or elements)
            - elements overlapping or colliding
            - broken layout at the mobile width (content cut off,
              unusably cramped, elements stacked wrongly)

            Then write your findings to visual-review.md (repo root) as
            GitHub-flavored markdown, starting with the heading
            "## Visual review" followed by a one-line verdict. If
            everything looks fine, say so in one short paragraph — do not
            invent nitpicks. If there are problems, list each as a bullet:
            **page (viewport)** — what is wrong, in one or two sentences.
            Order the list most-severe first. This review is advisory;
            keep it short and concrete. End the file with the line:
            "*Automated visual review of [this run's
            screenshots](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Advisory only — it does not block merging.*"

      - name: Comment review on PR
        if: steps.check.outputs.enabled == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: visual-review
          path: visual-review.md
