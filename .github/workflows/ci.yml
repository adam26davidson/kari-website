name: CI

# Runs on every pull request (the gate for auto-merge) and on pushes to main
# so the default branch stays green.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The e2e specs and playwright.config.ts are outside the build's
      # tsconfigs (Playwright transpiles without checking), so type-check
      # them explicitly.
      - name: Typecheck e2e
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend (Playwright e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      # The e2e stack is fully local and hermetic: a throwaway MinIO stands
      # in for S3 (seeded with fixture content by ui/e2e/seed.mjs), and the
      # real API runs on localhost:3000 against it. No AWS account or shared
      # bucket is involved, so runs can't be broken by drifting bucket data.
      - name: Start local S3 (MinIO)
        run: |
          docker run -d --rm --name kari-e2e-s3 -p 9000:9000 \
            -e MINIO_ROOT_USER=kari-e2e \
            -e MINIO_ROOT_PASSWORD=kari-e2e-secret \
            minio/minio server /data

      # Create + seed the bucket before the API starts: its /health probes
      # S3 read/write, so the bucket must exist first. (npm run test:e2e
      # re-seeds, which is idempotent.)
      - name: Seed local S3
        run: node e2e/seed.mjs

      - name: Build API
        working-directory: api
        run: cargo build

      - name: Start API
        working-directory: api
        env:
          BUCKET_NAME: kari-e2e
          AWS_ENDPOINT_URL: http://localhost:9000
          AWS_REGION: us-east-1
          # Local MinIO credentials (match the docker run above) — not secrets.
          AWS_ACCESS_KEY_ID: kari-e2e
          AWS_SECRET_ACCESS_KEY: kari-e2e-secret
        run: |
          PORT=3000 nohup cargo run > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy" >&2
          cat api.log >&2
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # Test-tenant Auth0 credentials enable the admin journey specs;
          # without them only the visitor/smoke suites run.
          E2E_AUTH0_USERNAME: ${{ secrets.E2E_AUTH0_USERNAME }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}

      - name: Show API log
        if: ${{ !cancelled() }}
        working-directory: api
        run: cat api.log || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Frontend coverage
        working-directory: ui
        run: |
          set -o pipefail
          npm ci
          npm run test:coverage | tee coverage-report.txt

      - name: API coverage
        working-directory: api
        run: |
          set -o pipefail
          # --fail-under-lines is the coverage ratchet: pinned just below the
          # current number; bump it when coverage rises (see CLAUDE.md).
          cargo llvm-cov --json --summary-only --fail-under-lines 86 --output-path coverage.json
          cargo llvm-cov report | tee coverage-report.txt

      - name: Build coverage comment
        run: |
          ui_lines=$(jq -r '.total.lines.pct' ui/coverage/coverage-summary.json)
          ui_funcs=$(jq -r '.total.functions.pct' ui/coverage/coverage-summary.json)
          api_lines=$(jq -r '(.data[0].totals.lines.percent * 10 | round) / 10' api/coverage.json)
          api_funcs=$(jq -r '(.data[0].totals.functions.percent * 10 | round) / 10' api/coverage.json)
          {
            echo "## Test coverage"
            echo ""
            echo "| Area | Lines | Functions |"
            echo "| --- | --- | --- |"
            echo "| Frontend (\`ui/src\`) | ${ui_lines}% | ${ui_funcs}% |"
            echo "| API (Rust) | ${api_lines}% | ${api_funcs}% |"
            echo ""
            echo "Per-file breakdown in the [job summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > coverage-comment.md
          {
            cat coverage-comment.md
            echo ""
            echo "<details><summary>Frontend per-file</summary>"
            echo ""
            echo '```'
            sed -n '/Coverage report from/,$p' ui/coverage-report.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>API per-file</summary>"
            echo ""
            echo '```'
            cat api/coverage-report.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-comment.md

  api:
    name: API (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
