name: CI

# Runs on every pull request (the gate for auto-merge) and on pushes to main
# so the default branch stays green.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job sets timeout-minutes. Without one a hung step (a stalled apt/npm/
# docker fetch inside the e2e stack, say) runs toward GitHub's 6-hour default,
# burning runner minutes and blocking anything that waits on the checks. The
# values are observed p90 plus generous headroom — see each job — so a real
# hang fails within minutes and an empty-commit retrigger recovers it.
# The shell-lint job enforces this on every workflow in the repo, so a
# new job cannot ship without one.
jobs:
  shell-lint:
    name: Shell and workflows (lint, script tests)
    runs-on: ubuntu-latest
    # Observed: seconds. Nearly all of it is the image pulls.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The same script anyone can run locally (see CLAUDE.md): actionlint
      # over .github/ — including shellcheck on every embedded `run:` —
      # plus the assertion that every job sets a job-level timeout-minutes,
      # so the paragraph above cannot quietly stop being true, shellcheck
      # over every *.sh in the repo, and the check that each pinned docker
      # image in them carries its renovate annotation.
      #
      # --images because runners ship their own shellcheck and yq, and the
      # runner's shellcheck (0.9) disagrees with the pin (0.11) about real
      # findings — it reds a trap handler as SC2317 that the pin reports as
      # SC2329 (#340). Forcing the pins costs two more image pulls and buys
      # a CI result anyone can reproduce with the same flag.
      - name: Lint workflows and shell scripts
        run: ./scripts/lint-workflows.sh --images

      # The shell test harnesses. They were local-only until #291, which
      # meant a regression in the dispatcher (#276) or in the setup script
      # every worktree runs first only showed up in use. All of them are
      # stubbed, hermetic and take seconds, so they run on every PR rather
      # than behind a path filter.
      - name: Dispatcher tests
        run: bash automation/dispatch-test.sh

      # Points KARI_SYSTEMD_USER_DIR at a temp dir and systemctl at a
      # stub, so it never touches a real unit dir — here or on the
      # maintainer's laptop, where the fleet's timer is live.
      - name: Timer install tests
        run: bash automation/install-timer-test.sh

      - name: Worktree setup tests
        run: bash scripts/setup-worktree-test.sh

      # The lint above only proves this repo is clean; this proves the lint
      # would still catch a repo that is not (#337). It needs jq plus one
      # YAML→JSON backend, and takes whichever of python3 + PyYAML or the
      # runner's yq works — no install step, and no assumption about which
      # of the two a future runner image keeps.
      - name: Workflow lint tests
        run: bash scripts/lint-workflows-test.sh

  frontend:
    name: Frontend (lint, build, unit tests)
    runs-on: ubuntu-latest
    # Observed: ~1 min (max 1.3).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` below type-checks src/** on its way to bundling, so
      # this step is not the only thing standing between a type error and a
      # red CI. It runs first so the failure is named "Typecheck" instead of
      # surfacing minutes later as a build failure, and so it fails before
      # the unit tests (which transpile without checking types) spend their
      # time. `tsc -b` is incremental, so the build's own pass is a no-op
      # after this one.
      - name: Typecheck
        run: npm run typecheck

      # The e2e specs and playwright.config.ts are outside the build's
      # tsconfigs (Playwright transpiles without checking), so type-check
      # them explicitly.
      - name: Typecheck e2e
        run: npm run typecheck:e2e

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend (Playwright e2e)
    runs-on: ubuntu-latest
    # Observed: median ~2.5 min, p90 ~8.5, and a long tail entirely from
    # runner-side network stalls in the stack setup (apt/docker/cargo fetches
    # crawling). 20 min clears every non-pathological run; the rare run that
    # trips it was already stalled and is better retriggered than waited on.
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # Node + npm ci, Rust + cargo cache, MinIO seeded with fixture
      # content, the API health-polled on localhost:3000, and Playwright's
      # chromium. Shared with visual-review.yml — see the action for the
      # hermetic-stack details.
      - name: Stand up hermetic e2e stack
        # Bounds setup separately from the tests, so a stalled fetch fails
        # here in minutes instead of eating the job's whole budget and
        # leaving "did the tests hang?" ambiguous. Composite actions cannot
        # set timeout-minutes on their inner steps (GitHub limitation), so
        # this caller step is the only lever. Setup is ~1-4 min with the
        # caches warm; 12 leaves the cold-cache path (cargo build from
        # scratch, a browser download) plenty of room.
        timeout-minutes: 12
        uses: ./.github/actions/e2e-stack

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          # Test-tenant Auth0 credentials enable the admin journey specs;
          # without them only the visitor/smoke suites run.
          E2E_AUTH0_USERNAME: ${{ secrets.E2E_AUTH0_USERNAME }}
          E2E_AUTH0_PASSWORD: ${{ secrets.E2E_AUTH0_PASSWORD }}

      - name: Show API log
        if: ${{ !cancelled() }}
        working-directory: api
        run: cat api.log || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    # Observed: ~2 min with a warm cargo cache; a cold instrumented build is
    # much slower, hence the wide margin.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Frontend coverage
        working-directory: ui
        run: |
          set -o pipefail
          npm ci
          npm run test:coverage | tee coverage-report.txt

      - name: API coverage
        working-directory: api
        run: |
          set -o pipefail
          # --fail-under-lines is the coverage ratchet: pinned just below the
          # current number; bump it when coverage rises (see CLAUDE.md).
          cargo llvm-cov --json --summary-only --fail-under-lines 90 --output-path coverage.json
          cargo llvm-cov report | tee coverage-report.txt

      - name: Build coverage comment
        run: |
          ui_lines=$(jq -r '.total.lines.pct' ui/coverage/coverage-summary.json)
          ui_funcs=$(jq -r '.total.functions.pct' ui/coverage/coverage-summary.json)
          api_lines=$(jq -r '(.data[0].totals.lines.percent * 10 | round) / 10' api/coverage.json)
          api_funcs=$(jq -r '(.data[0].totals.functions.percent * 10 | round) / 10' api/coverage.json)
          {
            echo "## Test coverage"
            echo ""
            echo "| Area | Lines | Functions |"
            echo "| --- | --- | --- |"
            echo "| Frontend (\`ui/src\`) | ${ui_lines}% | ${ui_funcs}% |"
            echo "| API (Rust) | ${api_lines}% | ${api_funcs}% |"
            echo ""
            echo "Per-file breakdown in the [job summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > coverage-comment.md
          {
            cat coverage-comment.md
            echo ""
            echo "<details><summary>Frontend per-file</summary>"
            echo ""
            echo '```'
            sed -n '/Coverage report from/,$p' ui/coverage-report.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>API per-file</summary>"
            echo ""
            echo '```'
            cat api/coverage-report.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: coverage-comment.md

  api:
    name: API (fmt, clippy, tests)
    runs-on: ubuntu-latest
    # Observed: ~1 min with a warm cargo cache; a cold build needs the margin.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
