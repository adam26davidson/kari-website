[package]
name = "kari-website-api"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Compile-time gate for the local development auth bypass (#266). NOT a
# default feature: `cargo build` / `cross build --release` (what deploy.yml
# runs) leave every line of the bypass out of the binary entirely. Only the
# dev stack, the e2e stack and CI's second test pass turn it on, and even
# then it stays inert unless KARI_DEV_AUTH=1 is in the environment.
[features]
dev-auth = []

[dependencies]
axum = { version="0.8.9", features = ["multipart", "macros"] }
bytes = "1.12.1"
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tower = {version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
hyper = "0.14.32"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
aws-config = "1.12.0"
# Default features minus `rustls`: that one compiles in the legacy hyper
# 0.14 / rustls 0.21 / ring connector, whose rustls-webpki 0.101 has no
# patched release (#784). With `BehaviorVersion::latest()` the SDK already
# picks `default-https-client` (hyper 1 / rustls 0.23 / aws-lc-rs), so this
# removes dead code, not the client S3 calls actually use.
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-smithy-types = "1.8.1"
aws-sig-auth = "0.60.3"
async-trait = "0.1.92"
mime_guess = "2.0.5"
uuid = { version = "1.26.1", features = ["v4"] }
dotenv = "0.15"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[dev-dependencies]
tower-test = "0.4.0"
http-body-util = "0.1.5"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio", "test-util"] }
aws-smithy-mocks = "0.3.0"
aws-smithy-runtime-api = "1.19.0"
